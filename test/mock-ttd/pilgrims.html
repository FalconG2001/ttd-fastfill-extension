<!doctype html>
<html><head><meta charset="utf-8"><title>Mock TTD Pilgrims v0.5</title>
<style>body{font-family:Arial;padding:24px;background:#fff7fb;color:#233443}.row{display:grid;grid-template-columns:2fr .7fr 1fr 1.2fr 1.5fr 1.5fr;gap:10px;margin:12px 0}.floating-input{padding:8px;width:100%}.dd{position:relative}.menu{position:absolute;left:0;right:0;top:36px;background:white;border:1px solid #ddd;z-index:10}.menu ul{list-style:none;margin:0;padding:4px}.menu li{padding:6px;cursor:pointer}</style></head>
<body>
<h1>Pilgrim Details</h1>
<p id="summary"></p>
<div id="rows"></div>
<button id="back">Back</button><button id="continue">Continue</button>
<script>
const booking=JSON.parse(localStorage.getItem('mockBooking')||'{}');
const count=Math.max(1,Number(booking.tickets||1));
document.getElementById('summary').textContent=`Mock TTD rendered ${count} pilgrim row(s).`;
const rows=document.getElementById('rows');
for(let i=0;i<count;i++){
 const row=document.createElement('div'); row.className='row';
 row.innerHTML=`<div><input class="floating-input" label="Name" name="fname" id="${i}" value=""></div>
 <div><input class="floating-input" label="Age" name="age" id="${i}" type="number" value=""></div>
 <div class="dd"><input class="floating-input" label="Gender" name="gender" id="${i}" readonly value=""><div class="menuhost"></div></div>
 <div class="dd"><input class="floating-input" label="Gothram" name="gothram" id="gothram-${i}" readonly required value=""><div class="menuhost"></div></div>
 <div class="dd"><input class="floating-input" label="Photo ID Proof" name="photoIdType" id="${i}" readonly value=""><div class="menuhost"></div></div>
 <div><input class="floating-input" label="Photo Id Number" name="idProofNumber" id="${i}" disabled value=""></div>`;
 rows.appendChild(row);
}
function setup(input, options, enableId=false){input.addEventListener('click',()=>{const host=input.parentElement.querySelector('.menuhost');if(host.innerHTML){host.innerHTML='';return;}host.innerHTML='<div class="menu"><ul>'+options.map(x=>'<li>'+x+'</li>').join('')+'</ul></div>';host.querySelectorAll('li').forEach(li=>li.onclick=(e)=>{e.stopPropagation();input.value=li.textContent;input.dispatchEvent(new Event('input',{bubbles:true}));host.innerHTML='';if(enableId){const id=input.closest('.row').querySelector('input[name="idProofNumber"]');id.disabled=false;}});});}
document.querySelectorAll('input[name="gender"]').forEach(i=>setup(i,['Female','Male','Transgender']));
document.querySelectorAll('input[name="gothram"]').forEach(i=>setup(i,['Bharadwaja','Kashyapa','Vasishta']));
document.querySelectorAll('input[name="photoIdType"]').forEach(i=>setup(i,['Aadhaar Card','Passport'],true));
document.getElementById('back').onclick=()=>location.href='slot.html';
document.getElementById('continue').onclick=()=>{
 const people=[...document.querySelectorAll('.row')].map(row=>({name:row.querySelector('[name=fname]').value,gothram:row.querySelector('[name=gothram]').value}));
 localStorage.setItem('mockPilgrims',JSON.stringify(people)); location.href='review.html';
};
</script>
</body></html>
