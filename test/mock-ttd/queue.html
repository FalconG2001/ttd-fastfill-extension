<!doctype html>
<html><head><meta charset="utf-8"><title>Mock TTD Queue v0.5.1</title>
<style>
body{font-family:Arial,sans-serif;padding:32px;background:#fff7fb;color:#233443}.card{max-width:620px;background:#fff;padding:24px;border-radius:18px;box-shadow:0 4px 18px #0002}.timer{font-size:44px;font-weight:700;color:#639;margin:18px 0}.note{font-size:14px;line-height:1.5}
</style></head>
<body>
<div class="card" id="queue-card">
  <h1>Virtual Queue</h1>
  <p>Please wait. Booking starts in:</p>
  <div id="countdown" class="timer">00:15</div>
  <p class="note">Open FastFill and click <b>Live inspector</b>. The countdown should appear and keep updating. You can also disable/reload the extension itself, then use <b>Attach without reload</b>; do not reload this page.</p>
  <p id="done" class="note"></p>
</div>
<script>
let remaining=15;
const el=document.getElementById('countdown');
const done=document.getElementById('done');
const tick=()=>{
  remaining=Math.max(0,remaining-1);
  el.textContent='00:'+String(remaining).padStart(2,'0');
  if(remaining===0){done.textContent='Countdown complete. This mock intentionally stays on the same page so you can test attachment and inspection without a page reload.';clearInterval(timer);}
};
const timer=setInterval(tick,1000);
</script>
</body></html>
