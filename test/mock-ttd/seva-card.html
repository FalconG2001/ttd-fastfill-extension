<!doctype html>
<html><head><meta charset="utf-8"><title>Mock TTD Seva Card v0.5.5</title>
<style>
body{font-family:Arial,sans-serif;padding:24px;background:#fff7fb;color:#233443}.card{background:#fff;padding:20px;border-radius:16px;margin:12px 0;box-shadow:0 3px 14px #0002}.service{display:grid;grid-template-columns:1fr 1fr;gap:24px}.floating-input{padding:10px;width:100%;box-sizing:border-box}.month{width:520px}table{width:100%}td{padding:10px;text-align:center}.available{background:rgb(255,191,0);cursor:pointer;pointer-events:auto}.selected{background:rgb(102,51,153)!important;color:#fff}.hidden{display:none}.sevas{display:flex;gap:22px}.seva{display:flex;border-radius:16px;box-shadow:0 4px 16px #0003;overflow:hidden;min-width:340px}.count{padding:20px;background:#79c139;color:#fff;font-weight:700;text-align:center}.count.zero{background:#f22}.body{padding:16px;display:flex;flex:1;justify-content:space-between}.radio{width:20px;height:20px}.actions{display:flex;justify-content:flex-end;gap:12px;margin-top:18px}
</style></head><body>
<h1>Arjitha Seva</h1>
<div class="card"><h3>Service Name</h3><div class="service">
<input label="Temple" name="templeSelected" readonly value="Sri Padmavathi Ammavari Temple-Tiruchanoor">
<input label="Select Seva" name="sevaSelected" readonly value="Kalyanotsavam">
</div></div>
<div class="card"><h3>Seva Slots</h3><div class="month"><div>October 2026</div><table><tr><td id="28/9" class="available">28</td></tr></table></div></div>
<div id="scrollSlotType" class="card hidden">
<div><b>Select any 1 Seva: Dated 28 Oct,2026</b> &nbsp; <span>Number of Tickets</span>
<input name="noOfTickets" readonly disabled value="01" placeholder="01"></div>
<div class="sevas">
<div class="seva"><div class="count">17<br><small>Available</small></div><div class="body"><div><b>Kalyanotsavam<br>(10:00 AM)</b><br>2 Persons<br>₹500</div><button class="radio" aria-label="Kalyanotsavam"></button></div></div>
<div class="seva"><div class="count zero">0<br><small>Available</small></div><div class="body"><div><b>Suprabhatam<br>(04:30 AM)</b><br>1 Person<br>₹50</div><button class="radio" aria-label="Suprabhatam"></button></div></div>
</div><div style="color:red">Please select an available slot</div></div>
<div class="actions"><button>Back</button><button id="continue" disabled>Continue</button></div>
<script>
let selected=''; document.getElementById('28/9').onclick=()=>{document.getElementById('28/9').classList.add('selected');document.getElementById('scrollSlotType').classList.remove('hidden')};
document.querySelector('[aria-label=Kalyanotsavam]').onclick=()=>{selected='Kalyanotsavam';document.getElementById('continue').disabled=false};
document.querySelector('[aria-label=Suprabhatam]').onclick=()=>{};
document.getElementById('continue').onclick=()=>{if(!selected)return;localStorage.setItem('mockBooking',JSON.stringify({date:'28',isoDate:'2026-10-28',displayDate:'28/10/2026',slot:'',tickets:1,mode:'seva-card',sevaChoice:selected,temple:document.querySelector('[name=templeSelected]').value,seva:document.querySelector('[name=sevaSelected]').value}));location.href='seva-pilgrims.html'};
</script></body></html>
